biography: "I am a Ph.D. student in Mathematics at the Georgia Institute of Technology. My research interests lie broadly in machine learning, with a current focus on LLM reasoning, agentic AI, and multi-agent systems. I am particularly interested in how AI agents can reason, use tools, and collaborate efficiently and reliably under limited computational resources. I received my B.S. in Mathematics from the University of Illinois Urbana-Champaign."

