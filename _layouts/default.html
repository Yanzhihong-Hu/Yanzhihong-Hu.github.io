---
layout: compress
---
{% include base_path %}
<!doctype html>
<html lang="{{ site.locale | default: 'en-US' | slice: 0, 2 }}" class="no-js">
  <head>
    {% include head.html %}
    {% include head/custom.html %}
  </head>
  <body class="page-{{ page.url | default: '/' | slugify }}">
    <a class="skip-link" href="#main-content">Skip to content</a>
    {% include masthead.html %}
    <main id="main-content" tabindex="-1">
      {{ content }}
    </main>
    {% include footer.html %}
    {% include scripts.html %}
  </body>
</html>
